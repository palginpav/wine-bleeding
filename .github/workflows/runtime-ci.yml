name: runtime-ci

on:
  push:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-ci.yml"
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-ci.yml"

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: make -C runtime lint

  test:
    name: bats (${{ matrix.bash-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bash-version: ["4.4", "5.2"]
    container:
      image: bash:${{ matrix.bash-version }}
    steps:
      - name: Install runtime deps (before checkout so git is available)
        run: apk add --no-cache bash ncurses jq grep coreutils findutils tar gzip zstd sed python3 wget curl ca-certificates make git flock

      - uses: actions/checkout@v4

      - name: Install bats-core from release tarball
        run: |
          wget -qO- https://github.com/bats-core/bats-core/archive/refs/tags/v1.11.1.tar.gz | tar xz
          ./bats-core-1.11.1/install.sh /usr/local

      - name: Create non-root test user
        # wb-tools-manager.py refuses to run as euid=0 (matches production
        # invariant: managed tools live under HOME, not /root). Run bats as a
        # regular user so 40_tools_manager tests exercise the real read path.
        run: |
          adduser -D -u 1001 tester
          chown -R tester:tester "${GITHUB_WORKSPACE}"

      - name: Run bats tests
        run: su tester -c "make -C runtime test"

  schema-check:
    name: schema-check (check-jsonschema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install -y jq
          pip install check-jsonschema

      - name: Run schema-check
        run: make -C runtime schema-check
